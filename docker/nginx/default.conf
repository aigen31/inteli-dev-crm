# Trust Traefik reverse proxy
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 10.0.0.0/8;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# ── Landing page: inteli-dev.ru ────────────────────────
server {
    listen 8080;
    server_name inteli-dev.ru;
    root /var/www/promo;
    index landing.html;

    charset utf-8;
    server_tokens off;

    location / {
        try_files $uri $uri/ /landing.html;
    }

    # Block setup scripts from external access
    location ~ ^/api/setup-.*\.php$ {
        deny all;
    }

    # PHP handler for contact form API
    location ~ ^/api/.*\.php$ {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 15;

        fastcgi_param HTTPS on;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
        expires 7d;
        access_log off;
        add_header Cache-Control "public";
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}

# ── CRM application: crm.inteli-dev.ru ─────────────────
server {
    listen 80;
    server_name crm.inteli-dev.ru;
    root /var/www/public;
    index index.php;

    charset utf-8;

    client_max_body_size 25M;

    # Security: hide server version
    server_tokens off;

    # Assets with long cache
    location /build/ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # Static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 7d;
        access_log off;
        add_header Cache-Control "public";
    }

    location /favicon.ico { access_log off; log_not_found off; }
    location /robots.txt  { access_log off; log_not_found off; }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60;

        # Pass real client IP behind Traefik
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
