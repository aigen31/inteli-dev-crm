# Local development edge: publishes the CRM on APP_PORT for the host.
# Production uses the Traefik-fronted `nginx` service; this container only
# replaces the host port binding when the host cannot route the assistant
# Docker subnet.
server {
    listen 80;
    server_name _;
    root /var/www/public;
    index index.php;
    charset utf-8;
    client_max_body_size 25M;
    server_tokens off;

    location /build/ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 7d;
        access_log off;
        add_header Cache-Control "public";
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60;
        fastcgi_param HTTPS $https if_not_empty;
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
