services:
  # ── PHP-FPM application ──────────────────────────────
  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
      target: production
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    volumes:
      - storage:/var/www/storage
      - app-public:/var/www/public
      - ./promo:/var/www/promo:ro
    networks:
      crm:
      # Unique alias: another CRM stack shares the `assistant` network, and a
      # bare `app` alias makes nginx and the kernel resolve the wrong one.
      assistant:
        aliases:
          - crm-app

  # ── Nginx web-server ─────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./promo:/var/www/promo:ro
      - app-public:/var/www/public:ro
    depends_on:
      - app
    labels:
      # ── CRM (crm.inteli-dev.ru) ──
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      - "traefik.http.routers.crm-prod.rule=Host(`${APP_DOMAIN:-crm.inteli-dev.ru}`)"
      - "traefik.http.routers.crm-prod.entrypoints=websecure"
      - "traefik.http.routers.crm-prod.tls.certresolver=letsencrypt"
      - "traefik.http.routers.crm-prod.service=crm-prod"
      - "traefik.http.routers.crm-prod-http.rule=Host(`${APP_DOMAIN:-crm.inteli-dev.ru}`)"
      - "traefik.http.routers.crm-prod-http.entrypoints=web"
      - "traefik.http.routers.crm-prod-http.middlewares=crm-prod-redirect"
      - "traefik.http.routers.crm-prod-http.service=crm-prod"
      - "traefik.http.middlewares.crm-prod-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.crm-prod-redirect.redirectscheme.permanent=true"
      - "traefik.http.services.crm-prod.loadbalancer.server.port=80"
      # ── Landing (inteli-dev.ru) ──
      - "traefik.http.routers.landing-prod.rule=Host(`inteli-dev.ru`)"
      - "traefik.http.routers.landing-prod.entrypoints=websecure"
      - "traefik.http.routers.landing-prod.tls.certresolver=letsencrypt"
      - "traefik.http.routers.landing-prod.service=landing-prod"
      - "traefik.http.services.landing-prod.loadbalancer.server.port=8080"
      # Security headers (shared)
      - "traefik.http.middlewares.crm-prod-headers.headers.stsSeconds=63072000"
      - "traefik.http.middlewares.crm-prod-headers.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.crm-prod-headers.headers.stsPreload=true"
      - "traefik.http.middlewares.crm-prod-headers.headers.forceSTSHeader=true"
      - "traefik.http.middlewares.crm-prod-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.crm-prod-headers.headers.frameDeny=true"
      - "traefik.http.middlewares.crm-prod-headers.headers.browserXssFilter=true"
      - "traefik.http.middlewares.crm-prod-headers.headers.referrerPolicy=strict-origin-when-cross-origin"
      - "traefik.http.middlewares.crm-prod-headers.headers.permissionsPolicy=camera=(), microphone=(), geolocation=()"
      # Rate limiting
      - "traefik.http.middlewares.crm-prod-ratelimit.ratelimit.average=100"
      - "traefik.http.middlewares.crm-prod-ratelimit.ratelimit.burst=50"
      - "traefik.http.middlewares.crm-prod-ratelimit.ratelimit.period=1s"
      # Apply middlewares
      - "traefik.http.routers.crm-prod.middlewares=crm-prod-headers,crm-prod-ratelimit"
      - "traefik.http.routers.landing-prod.middlewares=crm-prod-headers,crm-prod-ratelimit"
    networks:
      crm:
      traefik-public:
      assistant:
        aliases:
          - crm-nginx

  # ── Queue worker ─────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
      target: production
    restart: unless-stopped
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    volumes:
      - storage:/var/www/storage
    networks:
      - crm

  # ── Scheduler (cron) ─────────────────────────────────
  scheduler:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
      target: production
    restart: unless-stopped
    command: >
      sh -c "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    volumes:
      - storage:/var/www/storage
    networks:
      - crm

  # ── PostgreSQL ───────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-self_employed_crm}
      POSTGRES_USER: ${DB_USERNAME:-crm}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-crm}"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - crm

  # ── Redis ────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - crm

volumes:
  pgdata:
  redisdata:
  storage:
  app-public:

networks:
  crm:
    driver: bridge
  assistant:
    external: true
    name: inteli-dev-assistant
  traefik-public:
    external: true
