  <rect x="300" y="140" width="600" height="44" rx="16" fill="#3730A3" opacity="0.9"/>
  <rect x="300" y="168" width="600" height="16" fill="#3730A3" opacity="0.9"/>
  <!-- Window dots -->
  <circle cx="330" cy="162" r="7" fill="#EF4444" opacity="0.85"/>
  <circle cx="356" cy="162" r="7" fill="#FBBF24" opacity="0.85"/>
  <circle cx="382" cy="162" r="7" fill="#4ADE80" opacity="0.85"/>

  <!-- Terminal content -->
  <!-- Prompt line 1 -->
  <text x="340" y="224" font-family="'JetBrains Mono', monospace" font-size="22" font-weight="700" fill="#A5B4FC" opacity="0.9">$</text>
  <text x="365" y="224" font-family="'JetBrains Mono', monospace" font-size="22" fill="#C7D2FE" opacity="0.8">npx create-app my-site</text>

  <!-- Output line -->
  <text x="340" y="268" font-family="'JetBrains Mono', monospace" font-size="18" fill="#818CF8" opacity="0.6">✓ Installing dependencies...</text>

  <!-- Code block -->
  <text x="340" y="318" font-family="'JetBrains Mono', monospace" font-size="20" fill="#818CF8" opacity="0.7">import</text>
  <text x="432" y="318" font-family="'JetBrains Mono', monospace" font-size="20" fill="#C7D2FE" opacity="0.85">{ App, Router }</text>
  <text x="628" y="318" font-family="'JetBrains Mono', monospace" font-size="20" fill="#818CF8" opacity="0.7">from</text>
  <text x="690" y="318" font-family="'JetBrains Mono', monospace" font-size="20" fill="#A5B4FC" opacity="0.8">'vue'</text>

  <text x="340" y="358" font-family="'JetBrains Mono', monospace" font-size="20" fill="#818CF8" opacity="0.7">const</text>
  <text x="408" y="358" font-family="'JetBrains Mono', monospace" font-size="20" fill="#C7D2FE" opacity="0.85">site</text>
  <text x="455" y="358" font-family="'JetBrains Mono', monospace" font-size="20" fill="#818CF8" opacity="0.6">=</text>
  <text x="475" y="358" font-family="'JetBrains Mono', monospace" font-size="20" fill="#A5B4FC" opacity="0.8">new</text>
  <text x="518" y="358" font-family="'JetBrains Mono', monospace" font-size="20" fill="#C7D2FE" opacity="0.85">App()</text>

  <text x="340" y="398" font-family="'JetBrains Mono', monospace" font-size="20" fill="#C7D2FE" opacity="0.85">site</text>
  <text x="388" y="398" font-family="'JetBrains Mono', monospace" font-size="20" fill="#818CF8" opacity="0.7">.mount</text>
  <text x="470" y="398" font-family="'JetBrains Mono', monospace" font-size="20" fill="#A5B4FC" opacity="0.8">('#app')</text>

  <text x="340" y="438" font-family="'JetBrains Mono', monospace" font-size="20" fill="#C7D2FE" opacity="0.85">site</text>
  <text x="388" y="438" font-family="'JetBrains Mono', monospace" font-size="20" fill="#818CF8" opacity="0.7">.deploy</text>
  <text x="482" y="438" font-family="'JetBrains Mono', monospace" font-size="20" fill="#4ADE80" opacity="0.8">()</text>

  <!-- Blinking cursor -->
  <rect x="340" y="465" width="14" height="26" rx="2" fill="#A5B4FC" opacity="0.7">
    <animate attributeName="opacity" values="0.7;0.2;0.7" dur="1.2s" repeatCount="indefinite"/>
  </rect>

  <!-- Output success -->
  <text x="340" y="534" font-family="'JetBrains Mono', monospace" font-size="18" fill="#4ADE80" opacity="0.8">✓ Site deployed successfully!</text>

  <!-- Side decorative brackets -->
  <text x="140" y="420" font-family="'JetBrains Mono', monospace" font-size="120" fill="#C7D2FE" opacity="0.06">&lt;/&gt;</text>
  <text x="920" y="350" font-family="'JetBrains Mono', monospace" font-size="80" fill="#A5B4FC" opacity="0.06">{...}</text>

  <!-- Tech pills floating -->
  <rect x="100" y="440" width="100" height="32" rx="16" fill="#3730A3" opacity="0.5"/>
  <text x="125" y="461" font-family="Inter, sans-serif" font-size="13" font-weight="500" fill="#C7D2FE" opacity="0.7">Laravel</text>
  <rect x="960" y="500" width="80" height="32" rx="16" fill="#3730A3" opacity="0.5"/>
  <text x="980" y="521" font-family="Inter, sans-serif" font-size="13" font-weight="500" fill="#C7D2FE" opacity="0.7">Vue.js</text>
  <rect x="1000" y="380" width="100" height="32" rx="16" fill="#3730A3" opacity="0.5"/>
  <text x="1013" y="401" font-family="Inter, sans-serif" font-size="13" font-weight="500" fill="#C7D2FE" opacity="0.7">WordPress</text>
  <rect x="140" y="520" width="80" height="32" rx="16" fill="#3730A3" opacity="0.5"/>
  <text x="160" y="541" font-family="Inter, sans-serif" font-size="13" font-weight="500" fill="#C7D2FE" opacity="0.7">React</text>

  <!-- Bottom label -->
  <text x="600" y="700" text-anchor="middle" font-family="Inter, sans-serif" font-size="28" font-weight="600" fill="#FFFFFF" opacity="0.9">Разработка сайтов</text>
  <text x="600" y="735" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" fill="#C7D2FE" opacity="0.6">WordPress · Laravel · Vue · React</text>
</svg>
