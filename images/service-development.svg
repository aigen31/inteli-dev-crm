<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312E81"/>
      <stop offset="100%" stop-color="#4338CA"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="url(#bg)"/>

  <!-- Decorative circles -->
  <circle cx="120" cy="680" r="180" fill="#4F46E5" opacity="0.12"/>
  <circle cx="1080" cy="120" r="220" fill="#6366F1" opacity="0.1"/>
  <circle cx="950" cy="620" r="100" fill="#818CF8" opacity="0.08"/>
  <circle cx="250" cy="150" r="90" fill="#4F46E5" opacity="0.08"/>

  <!-- Sparkles -->
  <path d="M180 300 L183 292 L190 289 L183 286 L180 278 L177 286 L170 289 L177 292Z" fill="#A5B4FC" opacity="0.3"/>
  <path d="M1020 480 L1024 470 L1034 466 L1024 462 L1020 452 L1016 462 L1006 466 L1016 470Z" fill="#C7D2FE" opacity="0.25"/>
  <path d="M850 180 L853 174 L859 172 L853 170 L850 164 L847 170 L841 172 L847 174Z" fill="#A5B4FC" opacity="0.2"/>
  <path d="M300 550 L302 545 L307 543 L302 541 L300 536 L298 541 L293 543 L298 545Z" fill="#C7D2FE" opacity="0.2"/>

  <!-- Terminal window -->
  <rect x="300" y="140" width="600" height="440" rx="16" fill="#1E1B4B" opacity="0.9"/>
