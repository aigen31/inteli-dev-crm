<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 80" width="400" height="80">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#312E81"/>
    </linearGradient>
    <linearGradient id="sparkGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A5B4FC"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
  </defs>

  <!-- Icon mark -->
  <g transform="translate(0, 0)">
    <!-- Rounded square background -->
    <rect x="4" y="4" width="72" height="72" rx="16" ry="16" fill="url(#bgGrad2)"/>

    <!-- Left code bracket < -->
    <path d="M30 24 L14 40 L30 56" stroke="#C7D2FE" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Right code bracket > -->
    <path d="M50 24 L66 40 L50 56" stroke="#C7D2FE" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Slash / -->
    <line x1="45" y1="21" x2="35" y2="59" stroke="#EEF2FF" stroke-width="3" stroke-linecap="round" opacity="0.6"/>

    <!-- AI Sparkle -->
    <g transform="translate(62, 14)">
      <path d="M0 -7 L1.3 -2 L6 0 L1.3 2 L0 7 L-1.3 2 L-6 0 L-1.3 -2 Z" fill="url(#sparkGrad2)"/>
    </g>
    <g transform="translate(69, 25)">
      <path d="M0 -3 L0.6 -1 L2.8 0 L0.6 1 L0 3 L-0.6 1 L-2.8 0 L-0.6 -1 Z" fill="#A5B4FC" opacity="0.7"/>
    </g>
  </g>

  <!-- Text: Евгений Биль -->
  <text x="92" y="38" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="700" fill="#1F2937">
    Евгений Биль
  </text>
  <text x="92" y="58" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="500" fill="#6B7280" letter-spacing="0.5">
    Fullstack-разработчик · AI
  </text>
</svg>
