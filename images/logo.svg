<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#312E81"/>
    </linearGradient>
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A5B4FC"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect x="10" y="10" width="180" height="180" rx="40" ry="40" fill="url(#bgGrad)"/>

  <!-- Left code bracket < -->
  <path d="M72 60 L38 100 L72 140" stroke="#C7D2FE" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Right code bracket > -->
  <path d="M128 60 L162 100 L128 140" stroke="#C7D2FE" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Slash / in the middle -->
  <line x1="112" y1="55" x2="88" y2="145" stroke="#EEF2FF" stroke-width="7" stroke-linecap="round" opacity="0.6"/>

  <!-- AI Sparkle (top-right) -->
  <g transform="translate(152, 38)">
    <path d="M0 -14 L2.5 -4 L12 0 L2.5 4 L0 14 L-2.5 4 L-12 0 L-2.5 -4 Z" fill="url(#sparkGrad)"/>
  </g>

  <!-- Small sparkle -->
  <g transform="translate(165, 60)">
    <path d="M0 -6 L1.2 -2 L5.5 0 L1.2 2 L0 6 L-1.2 2 L-5.5 0 L-1.2 -2 Z" fill="#A5B4FC" opacity="0.7"/>
  </g>

  <!-- Tiny sparkle -->
  <g transform="translate(140, 28)">
    <path d="M0 -4 L0.8 -1.3 L3.5 0 L0.8 1.3 L0 4 L-0.8 1.3 L-3.5 0 L-0.8 -1.3 Z" fill="#C7D2FE" opacity="0.5"/>
  </g>
</svg>
