<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#282570"/>
      <stop offset="100%" stop-color="#3730A3"/>
    </linearGradient>
    <linearGradient id="serverGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3730A3"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="url(#bg)"/>

  <!-- Decorative -->
  <circle cx="100" cy="600" r="160" fill="#4F46E5" opacity="0.1"/>
  <circle cx="1100" cy="200" r="190" fill="#6366F1" opacity="0.08"/>
  <circle cx="200" cy="120" r="100" fill="#818CF8" opacity="0.06"/>
  <circle cx="1000" cy="680" r="110" fill="#4F46E5" opacity="0.07"/>

  <!-- Sparkles -->
  <path d="M180 350 L184 340 L194 336 L184 332 L180 322 L176 332 L166 336 L176 340Z" fill="#A5B4FC" opacity="0.25"/>
  <path d="M1020 450 L1023 443 L1030 441 L1023 439 L1020 432 L1017 439 L1010 441 L1017 443Z" fill="#C7D2FE" opacity="0.2"/>

  <!-- Server rack -->
  <g transform="translate(370, 100)">
    <!-- Rack frame -->
    <rect x="0" y="0" width="460" height="520" rx="16" fill="#1E1B4B" opacity="0.7"/>
    <rect x="0" y="0" width="460" height="520" rx="16" fill="none" stroke="#3730A3" stroke-width="2" opacity="0.5"/>

    <!-- Server unit 1 -->
    <rect x="20" y="20" width="420" height="100" rx="10" fill="url(#serverGrad)" opacity="0.8"/>
    <rect x="20" y="20" width="420" height="100" rx="10" fill="none" stroke="#4F46E5" stroke-width="1" opacity="0.3"/>
    <!-- LEDs -->
    <circle cx="55" cy="70" r="5" fill="#4ADE80" opacity="0.9"/>
    <circle cx="75" cy="70" r="5" fill="#4ADE80" opacity="0.9"/>
    <circle cx="95" cy="70" r="5" fill="#FBBF24" opacity="0.7"/>
    <!-- Drive bays -->
    <rect x="130" y="40" width="28" height="60" rx="3" fill="#312E81" opacity="0.6"/>
    <rect x="165" y="40" width="28" height="60" rx="3" fill="#312E81" opacity="0.6"/>
    <rect x="200" y="40" width="28" height="60" rx="3" fill="#312E81" opacity="0.6"/>
    <rect x="235" y="40" width="28" height="60" rx="3" fill="#312E81" opacity="0.6"/>
    <rect x="270" y="40" width="28" height="60" rx="3" fill="#312E81" opacity="0.6"/>
    <rect x="305" y="40" width="28" height="60" rx="3" fill="#312E81" opacity="0.6"/>
    <!-- Port -->
    <rect x="370" y="45" width="45" height="30" rx="4" fill="none" stroke="#818CF8" stroke-width="2" opacity="0.4"/>
    <rect x="370" y="82" width="45" height="8" rx="2" fill="#818CF8" opacity="0.2"/>

    <!-- Server unit 2 -->
    <rect x="20" y="135" width="420" height="100" rx="10" fill="url(#serverGrad)" opacity="0.8"/>
    <rect x="20" y="135" width="420" height="100" rx="10" fill="none" stroke="#4F46E5" stroke-width="1" opacity="0.3"/>
    <circle cx="55" cy="185" r="5" fill="#4ADE80" opacity="0.9"/>
    <circle cx="75" cy="185" r="5" fill="#4ADE80" opacity="0.9"/>
    <circle cx="95" cy="185" r="5" fill="#4ADE80" opacity="0.9"/>
    <rect x="130" y="155" width="28" height="60" rx="3" fill="#312E81" opacity="0.6"/>
    <rect x="165" y="155" width="28" height="60" rx="3" fill="#312E81" opacity="0.6"/>
    <rect x="200" y="155" width="28" height="60" rx="3" fill="#312E81" opacity="0.6"/>
    <rect x="235" y="155" width="28" height="60" rx="3" fill="#312E81" opacity="0.6"/>
    <rect x="270" y="155" width="28" height="60" rx="3" fill="#312E81" opacity="0.6"/>
    <rect x="305" y="155" width="28" height="60" rx="3" fill="#312E81" opacity="0.6"/>
    <rect x="370" y="160" width="45" height="30" rx="4" fill="none" stroke="#818CF8" stroke-width="2" opacity="0.4"/>
    <rect x="370" y="197" width="45" height="8" rx="2" fill="#818CF8" opacity="0.2"/>

    <!-- Server unit 3 -->
    <rect x="20" y="250" width="420" height="100" rx="10" fill="url(#serverGrad)" opacity="0.8"/>
    <rect x="20" y="250" width="420" height="100" rx="10" fill="none" stroke="#4F46E5" stroke-width="1" opacity="0.3"/>
    <circle cx="55" cy="300" r="5" fill="#4ADE80" opacity="0.9"/>
    <circle cx="75" cy="300" r="5" fill="#4ADE80" opacity="0.9"/>
    <circle cx="95" cy="300" r="5" fill="#FBBF24" opacity="0.7"/>
    <rect x="130" y="270" width="28" height="60" rx="3" fill="#312E81" opacity="0.6"/>
    <rect x="165" y="270" width="28" height="60" rx="3" fill="#312E81" opacity="0.6"/>
    <rect x="200" y="270" width="28" height="60" rx="3" fill="#312E81" opacity="0.6"/>
    <rect x="235" y="270" width="28" height="60" rx="3" fill="#312E81" opacity="0.6"/>
    <rect x="270" y="270" width="28" height="60" rx="3" fill="#312E81" opacity="0.6"/>
    <rect x="305" y="270" width="28" height="60" rx="3" fill="#312E81" opacity="0.6"/>
    <rect x="370" y="275" width="45" height="30" rx="4" fill="none" stroke="#818CF8" stroke-width="2" opacity="0.4"/>
    <rect x="370" y="312" width="45" height="8" rx="2" fill="#818CF8" opacity="0.2"/>

    <!-- Server unit 4 -->
    <rect x="20" y="365" width="420" height="100" rx="10" fill="url(#serverGrad)" opacity="0.8"/>
    <rect x="20" y="365" width="420" height="100" rx="10" fill="none" stroke="#4F46E5" stroke-width="1" opacity="0.3"/>
    <circle cx="55" cy="415" r="5" fill="#4ADE80" opacity="0.9"/>
    <circle cx="75" cy="415" r="5" fill="#EF4444" opacity="0.7">
      <animate attributeName="opacity" values="0.7;0.2;0.7" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="95" cy="415" r="5" fill="#4ADE80" opacity="0.9"/>
    <rect x="130" y="385" width="28" height="60" rx="3" fill="#312E81" opacity="0.6"/>
    <rect x="165" y="385" width="28" height="60" rx="3" fill="#312E81" opacity="0.6"/>
    <rect x="200" y="385" width="28" height="60" rx="3" fill="#312E81" opacity="0.6"/>
    <rect x="235" y="385" width="28" height="60" rx="3" fill="#312E81" opacity="0.6"/>
    <rect x="270" y="385" width="28" height="60" rx="3" fill="#312E81" opacity="0.6"/>
    <rect x="305" y="385" width="28" height="60" rx="3" fill="#312E81" opacity="0.6"/>
    <rect x="370" y="390" width="45" height="30" rx="4" fill="none" stroke="#818CF8" stroke-width="2" opacity="0.4"/>
    <rect x="370" y="427" width="45" height="8" rx="2" fill="#818CF8" opacity="0.2"/>

    <!-- Connection lines between units -->
    <line x1="230" y1="120" x2="230" y2="135" stroke="#818CF8" stroke-width="2" opacity="0.3"/>
    <line x1="230" y1="235" x2="230" y2="250" stroke="#818CF8" stroke-width="2" opacity="0.3"/>
    <line x1="230" y1="350" x2="230" y2="365" stroke="#818CF8" stroke-width="2" opacity="0.3"/>
  </g>

  <!-- Transfer arrow -->
  <g transform="translate(870, 350)">
    <rect x="0" y="-6" width="100" height="12" rx="6" fill="#A5B4FC" opacity="0.6"/>
    <polygon points="90,-18 120,0 90,18" fill="#A5B4FC" opacity="0.6"/>
    <!-- Animated dots -->
    <circle cx="20" cy="0" r="4" fill="#C7D2FE" opacity="0.8">
      <animate attributeName="cx" values="20;80" dur="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0.2" dur="1.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Cloud/target icon -->
  <g transform="translate(1040, 320)">
    <path d="M-40 20 C-40 20 -50 -10 -20 -20 C-10 -30 20 -30 30 -20 C50 -15 50 10 40 20 Z" fill="#4F46E5" opacity="0.4" stroke="#A5B4FC" stroke-width="2"/>
    <text x="0" y="10" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" fill="#C7D2FE" opacity="0.7">→</text>
  </g>

  <!-- Tech pills -->
  <rect x="870" y="180" width="100" height="32" rx="16" fill="#1E1B4B" opacity="0.5"/>
  <text x="895" y="201" font-family="Inter, sans-serif" font-size="13" font-weight="500" fill="#C7D2FE" opacity="0.7">Ubuntu</text>
  <rect x="985" y="180" width="90" height="32" rx="16" fill="#1E1B4B" opacity="0.5"/>
  <text x="1009" y="201" font-family="Inter, sans-serif" font-size="13" font-weight="500" fill="#C7D2FE" opacity="0.7">Nginx</text>
  <rect x="870" y="225" width="80" height="32" rx="16" fill="#1E1B4B" opacity="0.5"/>
  <text x="896" y="246" font-family="Inter, sans-serif" font-size="13" font-weight="500" fill="#C7D2FE" opacity="0.7">SSL</text>
  <rect x="965" y="225" width="110" height="32" rx="16" fill="#1E1B4B" opacity="0.5"/>
  <text x="985" y="246" font-family="Inter, sans-serif" font-size="13" font-weight="500" fill="#C7D2FE" opacity="0.7">PHP-FPM</text>

  <!-- Bottom label -->
  <text x="600" y="700" text-anchor="middle" font-family="Inter, sans-serif" font-size="28" font-weight="600" fill="#FFFFFF" opacity="0.9">Переносы и серверы</text>
  <text x="600" y="735" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" fill="#C7D2FE" opacity="0.6">Nginx · Apache · SSL · PHP-FPM · Перенос без простоя</text>
</svg>
