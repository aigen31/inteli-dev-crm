openapi: 3.1.0
info:
  title: inteli-dev Infrastructure API
  version: 1.0.0
  description: |
    Приём манифеста резервных копий от агента на сервере хранения.
    Админ-панель CRM работает через Inertia и этот контракт не использует.
servers:
  - url: https://crm.inteli-dev.ru
    description: Production
  - url: http://127.0.0.1:8099
    description: Test
security:
  - BearerAuth: []
paths:
  /api/infrastructure/report:
    post:
      summary: Принять манифест копий
      operationId: reportBackupManifest
      tags: [Backups]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Manifest'
      responses:
        '200':
          description: Манифест обработан
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [targets, runs, received_at]
                    properties:
                      targets: { type: integer, example: 1 }
                      runs: { type: integer, example: 3 }
                      received_at: { type: string, format: date-time }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Validation'
        '503':
          description: Приём отчётов выключен (нет INFRA_REPORT_TOKEN)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: INFRA_REPORT_TOKEN из окружения CRM
  schemas:
    Manifest:
      type: object
      required: [targets]
      properties:
        targets:
          type: array
          minItems: 1
          items:
            type: object
            required: [service_id, files]
            properties:
              service_id: { type: string, format: uuid }
              files:
                type: array
                items:
                  type: object
                  required: [name]
                  properties:
                    name: { type: string, maxLength: 255 }
                    size: { type: integer, minimum: 0 }
                    uploaded_at: { type: string, format: date-time }
                    sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
    Problem:
      type: object
      required: [error]
      properties:
        error: { type: string, example: unauthorized }
    ValidationProblem:
      type: object
      required: [message, errors]
      properties:
        message: { type: string }
        errors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
  responses:
    Unauthorized:
      description: Нет или неверный Bearer-токен
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Validation:
      description: Ошибка валидации манифеста
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ValidationProblem' }
